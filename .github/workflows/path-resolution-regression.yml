name: Fork path resolution full CI

on:
  push:
    branches: [ci/path-resolution-full]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Fork-only launcher. The proposed upstream branch does not contain this file.
# The repair code is unchanged. The fork also selects an Intel host for darwin-x64 because the
# original macos-latest jobs repeatedly retired without acquiring an ARM64 runner.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  read-summary-binary-parity:
    uses: ./.github/workflows/read-summary-binary-parity.yml
  session-worker-compile:
    uses: ./.github/workflows/session-worker-compile.yml
  native-prebuilds:
    uses: ./.github/workflows/native-prebuilds.yml
    with:
      full_ci: true
